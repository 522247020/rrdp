[package]
name = "rrdp"
version = "0.3.0"
edition = "2021"
description = "A CLI wrapper for xfreerdp3 to simplify remote desktop connections"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
anyhow = "1.0"
colored = "2.0"
dialoguer = "0.10"
ksni = { version = "0.3.6", features = ["blocking"] }

[profile.release]
opt-level = 3
lto = true
